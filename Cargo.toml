[package]
name = "zero2prod-axum"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod-axum"

[dependencies]
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "macros",
    "uuid",
    "migrate",
] }
axum = { version = "0.8.6", features = ["http2", "ws", "macros", "multipart"] }
chrono = { version = "0.4.42", features = ["serde"] }
config = { version = "0.15.19", features = ["yaml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-bunyan-formatter = "0.3.10"
tracing-subscriber = { version = "0.3.20", features = [
    "registry",
    "env-filter",
    "chrono",
    "local-time",
    "fmt",
] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
tracing-log = "0.2.0"
once_cell = "1.21.3"
secrecy = { version = "0.10.3", features = ["serde"] }
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
serde-aux = "4.7.0"
unicode-segmentation = "1.12.0"
validator = "0.20.0"
reqwest = { version = "0.12.24", features = ["json", "rustls-tls", "cookies"] }
rand = { version = "0.9.2", features = ["std_rng"] }
thiserror = "2.0.17"
anyhow = "1.0.100"
base64 = "0.22.1"
argon2 = { version = "0.5.3", features = ["rand", "std"] }
urlencoding = "2.1.3"
handlebars = "6.3.2"
htmlescape = "0.3.1"
hex = "0.4.3"
axum-messages = "0.8.0"
axum-extra = { version = "0.12.2", features = ["cookie"] }
time = "0.3.44"
tower-sessions = "0.14.0"
tower-sessions-redis-store = "0.16.0"

[dev-dependencies]
claims = "0.8.0"
fake = "4.4.0"
linkify = "0.10.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
wiremock = "0.6.5"
