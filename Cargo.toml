[package]
name = "zero2prod-axum"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod-axum"

[dependencies]
axum = { version = "0.8.6", features = ["http2", "ws", "macros", "multipart"] }
config = { version = "0.15.19", features = ["yaml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "macros", "uuid", "migrate"] }
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
reqwest = { version = "0.12.24", features = ["json", "rustls-tls"] }
